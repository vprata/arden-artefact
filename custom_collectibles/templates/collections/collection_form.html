{% extends "base.html" %}
{% block title %}{{ 'Edit' if collection else 'New' }} Collection – Custom Collectibles{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="mb-4">{{ 'Edit' if collection else 'New' }} Collection</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Name *</label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ collection.name if collection else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ collection.description if collection else '' }}</textarea>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category_id" class="form-select">
                            <option value="">— None —</option>
                            {% for cat in categories %}
                            <option value="{{ cat._id }}"
                                {% if collection and collection.category_id == cat._id %}selected{% endif %}>
                                {{ cat.name }}
                            </option>
                            {% endfor %}
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input class="form-check-input" type="checkbox" name="is_public" id="is_public"
                               {% if collection and collection.is_public %}checked{% endif %}>
                        <label class="form-check-label" for="is_public">
                            Make this collection public (visible to everyone)
                        </label>
                    </div>
                    <button type="submit" class="btn btn-primary">Save Collection</button>
                    <a href="{{ url_for('main.dashboard') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
