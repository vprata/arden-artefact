{% extends "base.html" %}
{% block title %}{{ 'Edit' if category else 'New' }} Category – Custom Collectibles{% endblock %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow">
            <div class="card-body p-4">
                <h2 class="mb-4">{{ 'Edit' if category else 'New' }} Category</h2>
                <form method="POST">
                    <div class="mb-3">
                        <label class="form-label">Name *</label>
                        <input type="text" name="name" class="form-control" required
                               value="{{ category.name if category else '' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Description</label>
                        <textarea name="description" class="form-control" rows="3">{{ category.description if category else '' }}</textarea>
                    </div>
                    <button type="submit" class="btn btn-primary">
                        {{ 'Save Changes' if category else 'Create Category' }}
                    </button>
                    <a href="{{ url_for('collections.list_categories') }}" class="btn btn-outline-secondary">Cancel</a>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
